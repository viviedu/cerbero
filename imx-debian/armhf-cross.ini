[constants]
sysroot = '/sysroot'
target_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=hard', '--sysroot=' + sysroot]

[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'pkg-config'

[built-in options]
c_args = target_args
cpp_args = target_args
c_link_args = ['--sysroot=' + sysroot]
cpp_link_args = ['--sysroot=' + sysroot]

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot + '/usr/lib/arm-linux-gnueabihf/pkgconfig', sysroot + '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
